name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff==0.15.17 pytest pytest-asyncio

      - name: Ruff
        run: ruff check app tests/unit tests/integration

      - name: Pytest
        run: pytest tests/unit tests/integration -q
