name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 운영 이미지와 같은 고정판을 먼저, .[dev] 는 이미 만족된 것을 올리지 않는다
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests/unit tests/integration

      - name: Pytest
        run: pytest tests/unit tests/integration -v
