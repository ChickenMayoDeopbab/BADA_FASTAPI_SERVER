name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare review context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .review
          git diff "origin/$BASE_REF...$HEAD_SHA" > .review/pr.diff
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | "[\(.user.login)] \(.path):\(.line // .original_line // "?") \(.body | gsub("\n"; " ") | .[0:500])"' \
            > .review/prior-comments.txt
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | "[\(.user.login)] \(.body | gsub("\n"; " ") | .[0:800])"' \
            >> .review/prior-comments.txt
          wc -l .review/*

      - name: Record review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install review dependencies
        run: |
          cp -r .github/claude-review "$RUNNER_TEMP/claude-review"
          npm ci --prefix "$RUNNER_TEMP/claude-review" --no-audit --no-fund

      - name: Claude Code Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT_FILE: ${{ runner.temp }}/claude-execution.jsonl
        run: node "$RUNNER_TEMP/claude-review/review.mjs"

      - name: Upload Claude transcript
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Verify review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          filter=".[] | select(.user.login == \"github-actions[bot]\" and .created_at >= \"$SINCE\") | .id"
          count=$( { gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "$filter"
                     gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq "$filter"; } | wc -l )
          echo "github-actions[bot] comments since $SINCE: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Claude 가 리뷰를 게시하지 않았다. claude-execution 아티팩트의 transcript 를 확인할 것."
            exit 1
          fi
