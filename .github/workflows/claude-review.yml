name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare review context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .review
          git diff "origin/$BASE_REF...$HEAD_SHA" > .review/pr.diff
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | "[\(.user.login)] \(.path):\(.line // .original_line // "?") \(.body | gsub("\n"; " ") | .[0:500])"' \
            > .review/prior-comments.txt
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | "[\(.user.login)] \(.body | gsub("\n"; " ") | .[0:800])"' \
            >> .review/prior-comments.txt
          wc -l .review/*

      - name: Record review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 전체를 코드리뷰해줘. 리뷰는 한국어로 작성한다.

            진행 방식 (반드시 지킨다):
            - 리뷰는 직접 한다. 스킬(/code-review 등)·서브에이전트에 맡기지 않는다. 그 결과는 PR 에 올라가지 않는다.
            - 총평은 `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }}` 로 직접 게시한다.
            - 게시 명령이 코멘트 URL 을 출력한 것을 확인하기 전에는 "게시했다"고 쓰거나 종료하지 않는다.
            - 질문이나 승인 요청으로 끝내지 않는다. 이 실행에는 답할 사람이 없다.

            준비된 파일 (저장소 루트의 .review/):
            - pr.diff: PR 전체 변경분. 먼저 전부 읽는다.
            - prior-comments.txt: 이 PR 에 이미 달린 코멘트 (사람·봇 모두).

            중점 확인 사항 (우선순위 순):
            - 버그, 잠재적 오류, 엣지 케이스
            - 보안 문제 (시크릿 노출, 입력 검증 등)

            범위 제한:
            - 파일 열람은 변경된 파일과 그 직접 호출부까지만. 저장소 전체 탐색은 하지 않는다.
            - prior-comments.txt 에 이미 있는 지적은 다시 달지 않는다. 이전 지적이 해결됐으면 총평에 한 줄로 적는다.
            - 인라인 코멘트는 최대 6개. 그 이상은 총평에 묶는다.

            특정 라인에 대한 지적은 인라인 코멘트로 남기고,
            전반적인 총평은 top-level 코멘트 하나로 남겨줘.
            문제가 없으면 간단히 승인 취지의 코멘트만 남긴다.
          claude_args: |
            --model claude-sonnet-5
            --effort low
            --disallowedTools "Skill,Task,Workflow,ReportFindings"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      - name: Upload Claude transcript
        if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 7

      - name: Verify review was posted
        if: steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          filter=".[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\") | .id"
          count=$( { gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "$filter"
                     gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq "$filter"; } | wc -l )
          echo "claude[bot] comments since $SINCE: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Claude 가 리뷰를 게시하지 않았다. claude-execution 아티팩트의 transcript 를 확인할 것."
            exit 1
          fi
