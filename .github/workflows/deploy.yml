name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff==0.15.17 pytest pytest-asyncio

      - name: Ruff
        run: ruff check app tests/unit tests/integration

      - name: Pytest
        run: pytest tests/unit tests/integration -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: image
        run: |
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ref=${BASE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,scripts/backup_logs.sh"
          target: "~/bada"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USERNAME,GHCR_PAT
          script: |
            set -euo pipefail
            cd ~/bada

            docker network create bada-net 2>/dev/null || true

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if [ -f scripts/backup_logs.sh ]; then
              COMPOSE_DIR="$HOME/bada" bash scripts/backup_logs.sh || echo "log backup failed (continuing deploy)" >&2
            fi

            export IMAGE
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            SECRET="$(grep -E '^INTERNAL_SECRET=' .env | cut -d= -f2-)"
            for i in $(seq 1 15); do
              if curl -fsS -H "X-Internal-Secret: $SECRET" \
                   http://localhost:8000/internal/v1/health >/dev/null; then
                echo "Health check passed."
                docker image prune -af --filter "until=336h" || true
                exit 0
              fi
              echo "Waiting for app to become healthy ($i/15)..."
              sleep 4
            done

            echo "Health check failed after deploy." >&2
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 app >&2
            exit 1
