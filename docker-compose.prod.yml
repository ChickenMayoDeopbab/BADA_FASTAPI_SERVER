# Production override. Always run together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ports / env_file / restart / depends_on are inherited from docker-compose.yml.
services:
  app:
    # Drop the inherited `build: .` so `up` never needs a build context on the
    # server (image is pulled from GHCR). IMAGE is injected at deploy time.
    build: !reset null
    image: ${IMAGE:?IMAGE env (GHCR image ref) is required}
    pull_policy: always
    # GCP STT 자격증명: 호스트의 ADC json을 마운트하고 ADC 경로로 노출.
    # google.auth.default() 가 자동 인식 → 코드 변경 불필요. 로컬 dev(base only)는 미적용.
    volumes:
      - ./secrets/gcp-adc.json:/secrets/gcp-adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-adc.json
