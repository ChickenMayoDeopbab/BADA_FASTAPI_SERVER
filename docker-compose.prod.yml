services:
  app:
    build: !reset null
    image: ${IMAGE:?IMAGE env (GHCR image ref) is required}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${SPRING_DB_USER:-bada}:${SPRING_DB_PASSWORD:-bada}@${SPRING_DB_HOST:-spring-db}:5432/${SPRING_DB_NAME:-bada}
    networks:
      - default
      - bada-net
    depends_on: !override
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    profiles: ["local-only"]
