services:
  app:
    build: !reset null
    image: ${IMAGE:?IMAGE env (GHCR image ref) is required}
    pull_policy: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./secrets/gcp-adc.json:/secrets/gcp-adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-adc.json
      DATABASE_URL: postgresql+asyncpg://${SPRING_DB_USER:-bada}:${SPRING_DB_PASSWORD:-bada}@${SPRING_DB_HOST:-spring-db}:5432/${SPRING_DB_NAME:-bada}
      SPRING_BOOT_INTERNAL_URL: http://${SPRING_APP_HOST:-spring-app}:8080
    networks:
      - default
      - bada-net
    depends_on: !override
      redis:
        condition: service_healthy
  db:
    profiles: ["local-only"]
