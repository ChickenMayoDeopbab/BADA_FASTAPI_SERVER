[project]
name = "bada-ai-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-json-logger>=2.0.7",

    # Infra
    "redis[hiredis]>=5.0.8",
    "aio-pika>=9.4.3",
    "celery[redis]>=5.4",

    # Database
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",

    # Async HTTP / WebSocket
    "httpx>=0.28",
    "websockets>=15.0",

    # AI Pipeline
    "google-cloud-speech>=2.33",
    "google-genai>=1.0",
    "anthropic>=0.52",
    "elevenlabs>=1.50",
    "PyJWT>=2.9",

    # Termor analysis
    "librosa>=0.10,<0.11",
    "scipy>=1.13",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff==0.15.17",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "librosa>=0.10,<0.11",
    "numpy==1.26.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**/manual_*.py" = ["E402"]
"tests/**/*stream_check*.py" = ["E402"]
"tests/stt/mic_check.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"